databases:
  - name: quantumlab-db
    plan: free
    databaseName: quantumlab
    postgresMajorVersion: "16"

services:
  - type: redis
    name: quantumlab-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: quantum-circuit-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: quantumlab-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: quantumlab-redis
          type: redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ENV
        value: production
