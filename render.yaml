databases:
  - name: quantumlab-db
    plan: free
    databaseName: quantumlab
    postgresMajorVersion: "16"

services:
  - type: redis
    name: quantumlab-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: quantum-circuit-backend
    runtime: docker
    # Build context must be the repo root, not backend/ — knowledge_base/
    # (read by the RAG pipeline) lives one level above backend/ and has to
    # be baked into the image; see backend/Dockerfile's comment.
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    # RAG (embeddings + chromadb) needs more than the free tier's 512MB RAM,
    # and disks (for persisting the vector index across deploys) require a
    # paid plan — pick the smallest plan that actually has enough memory.
    plan: starter
    disk:
      name: rag-data
      mountPath: /rag_data
      sizeGB: 1
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: quantumlab-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: quantumlab-redis
          type: redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ENV
        value: production
